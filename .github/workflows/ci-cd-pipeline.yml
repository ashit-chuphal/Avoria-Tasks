name: Deploy Interview App

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "670839969318"

  ECR_REPOSITORY: interview-app-backend

  ECS_CLUSTER: interview-appCluster
  ECS_SERVICE: interview-app-backend
  ECS_TASK_FAMILY: interview-app-backend
  CONTAINER_NAME: Main

  CONTAINER_PORT: "3000"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE_URI" \
            ./server/app

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Resolve task definition
        id: resolve-task-definition
        env:
          ECS_EXECUTION_ROLE_ARN: arn:aws:iam::670839969318:role/ecsTaskExecutionRole
        run: |
          set -euo pipefail

          echo "Checking task-definition family: $ECS_TASK_FAMILY"

          if aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json \
            > task-definition.json 2>/dev/null; then

            echo "Existing task definition found."

          else
            echo "No existing task definition found."
            echo "Creating initial task-definition file."

            jq -n \
              --arg family "$ECS_TASK_FAMILY" \
              --arg containerName "$CONTAINER_NAME" \
              --arg image "${{ steps.build-image.outputs.image }}" \
              --arg executionRoleArn "$ECS_EXECUTION_ROLE_ARN" \
              --arg region "$AWS_REGION" \
              --arg logGroup "/ecs/$ECS_TASK_FAMILY" \
              --argjson containerPort "$CONTAINER_PORT" \
              '{
                family: $family,
                networkMode: "awsvpc",
                requiresCompatibilities: ["FARGATE"],
                cpu: "256",
                memory: "512",
                executionRoleArn: $executionRoleArn,
                runtimePlatform: {
                  operatingSystemFamily: "LINUX",
                  cpuArchitecture: "X86_64"
                },
                containerDefinitions: [
                  {
                    name: $containerName,
                    image: $image,
                    essential: true,
                    portMappings: [
                      {
                        containerPort: $containerPort,
                        hostPort: $containerPort,
                        protocol: "tcp"
                      }
                    ],
                    logConfiguration: {
                      logDriver: "awslogs",
                      options: {
                        "awslogs-create-group": "true",
                        "awslogs-group": $logGroup,
                        "awslogs-region": $region,
                        "awslogs-stream-prefix": "ecs"
                      }
                    }
                  }
                ]
              }' > task-definition.json
          fi

          echo "Task-definition container information:"
          jq '{
            family,
            revision,
            containers: [
              .containerDefinitions[] | {
                name,
                image,
                portMappings
              }
            ]
          }' task-definition.json

      - name: Validate container name
        run: |
          set -euo pipefail

          if ! jq -e \
            --arg containerName "$CONTAINER_NAME" \
            '.containerDefinitions[]
             | select(.name == $containerName)' \
            task-definition.json > /dev/null; then

            echo "Container '$CONTAINER_NAME' was not found."
            echo "Available container names:"

            jq -r '.containerDefinitions[].name' task-definition.json

            exit 1
          fi

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true