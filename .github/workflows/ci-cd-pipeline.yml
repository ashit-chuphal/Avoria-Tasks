# Candidate should fix structure, security, AWS auth, Docker build, ECR push, and deployment logic.


name: Deploy Interview App

on:
  push:
    branches:
      - main

permissions:
  contents: read

# To improve cicd we can implement to use environment variables for AWS credentials and other sensitive information. This will help to avoid hardcoding sensitive data in the workflow file and improve security.
# env:
#   AWS_REGION: us-east-1
#   AWS_ACCOUNT_ID: "670839969318"
#   ECR_REPOSITORY: interview-app-backend
#   ECS_CLUSTER: interview-appCluster
#   CONTAINER_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        run: |
          docker tag interview-app:latest 670839969318.dkr.ecr.us-east-1.amazonaws.com/interview-app-backend:${{ github.sha }}
          docker push 670839969318.dkr.ecr.us-east-1.amazonaws.com/interview-app-backend:${{ github.sha }}

      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition interview-app-backend \
            --query taskDefinition \
            > task-definition.json

      - name: Render New Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: 670839969318.dkr.ecr.us-east-1.amazonaws.com/interview-app-backend:${{ github.sha }}

      - name: Deploy Backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: interview-app-backend
          cluster: interview-appCluster
          wait-for-service-stability: true